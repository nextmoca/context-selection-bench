name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history: the scrub gate scans commit messages too
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scrub gate (tree + commit history)
        run: python scripts/scrub_check.py --root .

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (deps + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tiny-N smoke tests (deterministic, no GPU, no keys)
        run: pytest -q

  visibility-guard:
    # Cheap insurance against an accidental public flip. This repository stays
    # private until a release is cut; a RELEASE.md is the release marker.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      metadata: read
    steps:
      - uses: actions/checkout@v4
      - name: Fail if public without a release marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vis=$(gh api "repos/${{ github.repository }}" --jq .visibility)
          echo "repository visibility: $vis"
          if [ "$vis" = "public" ] && [ ! -f RELEASE.md ]; then
            echo "::error::Repository is PUBLIC but no RELEASE.md exists: this is the pre-release visibility gate. Add RELEASE.md only when a release is intentionally cut."
            exit 1
          fi
